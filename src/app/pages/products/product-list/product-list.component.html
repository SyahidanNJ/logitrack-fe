<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold m-0">Product Management</h4>
  <button class="btn btn-primary" (click)="openModal(null)">
    <i class="bi bi-plus-lg me-1"></i> Add New
  </button>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Sku</th>
            <th>Name</th>
            <th>Category</th>
            <th>Uom</th>
            <th class="text-end" style="width: 120px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td><span class="badge bg-secondary">#{{ item.id }}</span></td>
            <td>{{ item.sku }}</td>
            <td><span class="fw-semibold">{{ item.name }}</span></td>
            <td>{{ item.category }}</td>
            <td>{{ item.unit }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="openModal(item.id)"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(item.id)"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr *ngIf="items.length === 0"><td colspan="10" class="text-center text-muted py-4">No data found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Product Form Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="productModalLabel">{{ selectedId ? 'Edit Product' : 'Add New Product' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <app-product-form 
          [itemId]="selectedId" 
          (saved)="onSaved()" 
          (cancel)="closeModal()">
        </app-product-form>
      </div>
    </div>
  </div>
</div>
