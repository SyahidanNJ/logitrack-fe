
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="form">

      <div class="mb-3">
        <label class="form-label fw-semibold">Select Employee NIK <span class="text-danger">*</span></label>
        <div class="position-relative" *ngIf="!isEdit">
          <input type="text" class="form-control" 
                 [value]="nikSearchText"
                 (input)="onNikSearch($event)"
                 (focus)="showNikDropdown = true"
                 (blur)="onNikBlur()"
                 placeholder="Search by NIK or Name..."
                 [ngClass]="{ 'is-invalid': submitted && f['nik'].errors }">
          
          <div *ngIf="showNikDropdown && filteredEmployees.length > 0" class="custom-dropdown shadow-sm border rounded">
            <div *ngFor="let emp of filteredEmployees" 
                 class="dropdown-item p-2" 
                 (mousedown)="selectEmployee(emp)">
              {{ emp.nik }} - {{ emp.name }}
            </div>
          </div>
        </div>
        <input *ngIf="isEdit" type="text" class="form-control" formControlName="nik" readonly>
        <div *ngIf="submitted && f['nik'].errors" class="invalid-feedback d-block">
          <div *ngIf="f['nik'].errors['required']">You must select an existing employee NIK</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="name" 
               [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" placeholder="John Doe">
        <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
          <div *ngIf="f['name'].errors['required']">Name is required</div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" formControlName="email" 
                 [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" placeholder="john@example.com">
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['email']">Please enter a valid email address</div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Department</label>
          <input type="text" class="form-control" formControlName="department" placeholder="Enter department name">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="role" [ngClass]="{ 'is-invalid': submitted && f['role'].errors }">
            <option value="admin">Admin</option>
            <option value="superadmin">Superadmin</option>
            <option value="driver">Driver</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Status</label>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" formControlName="is_active" id="activeSwitch">
            <label class="form-check-label" for="activeSwitch">Active Account</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-light" (click)="cancel.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ isEdit ? 'Update User' : 'Create User' }}
        </button>
      </div>

    </form>
