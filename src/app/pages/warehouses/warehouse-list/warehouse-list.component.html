<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold m-0">Warehouse Management</h4>
  <button class="btn btn-primary" (click)="openModal(null)">
    <i class="bi bi-plus-lg me-1"></i> Add New
  </button>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Address</th>
            <th class="text-end" style="width: 120px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of warehouses">
            <td><span class="badge bg-secondary">#{{ item.id }}</span></td>
            <td><span class="badge bg-dark">{{ item.code }}</span></td>
            <td class="fw-bold">{{ item.name }}</td>
            <td>{{ item.address || '-' }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="openModal(item.id)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(item.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="warehouses.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No warehouses found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Warehouse Form Modal -->
<div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="warehouseModalLabel">{{ selectedId ? 'Edit Warehouse' : 'Add New Warehouse' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <app-warehouse-form 
          [itemId]="selectedId" 
          (saved)="onSaved()" 
          (cancel)="closeModal()">
        </app-warehouse-form>
      </div>
    </div>
  </div>
</div>
